[project]
name = "pac-man-of-arrakis"
version = "1.0.0"
description = "A Dune-themed Pac-Man built with pygame (42 project)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pygame-ce>=2.5,<3"]

[tool.mypy]
python_version = "3.10"
exclude = ["^build/", "^dist/", "^\\.venv/"]

# The assigned A-Maze-ing package ships without type information.
[[tool.mypy.overrides]]
module = "mazegenerator"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
